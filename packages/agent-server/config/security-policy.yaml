# =============================================================================
# Security Policy Configuration - Prompt Injection Defense Framework
# =============================================================================
# Version: 3.0.0
# Last Updated: 2025-01-20
# Owner: AI Security Team
# Review Cycle: Quarterly
#
# This configuration is based on analysis of 15 recent production incidents
# and the attack patterns defined in data/attack_patterns.json
# =============================================================================

security_policy:
  version: "3.0.0"
  effective_date: "2025-02-15"
  review_date: "2025-05-15"
  classification: internal
  owner: "security-team"
  
  # --------------------------------------------------------------------------
  # RISK SCORING THRESHOLDS - Derived from incident data analysis
  # --------------------------------------------------------------------------
  # Source data: data/recent_incidents.csv (15 incidents)
  # Blocks: 11, Flags: 3, Allowed: 1
  # False positives: 3 (20%), False negatives: 1 (blocked base64 should be flagged)
  #
  # INC-2025-003: risk=0.45, action=allow_with_monitoring, FP=TRUE
  # INC-2025-010: risk=0.38, action=allow, FP=TRUE (base64 detection issue)
  # INC-2025-014: risk=0.42, action=allow, FP=TRUE (authority claim undetected)
  # INC-2025-004: risk=0.88, action=block, FN=FALSE (correctly blocked)
  
  # Optimized thresholds based on false positive/negative analysis:
  risk_thresholds:
    # Allow threshold - keep slightly higher to avoid blocking edge cases
    allow: 0.35           # Increased from 0.30 to avoid INC-2025-011 false positives
    flag: 0.60            # Same as current - for borderline cases
    block: 0.75          # Decreased from 0.85 to catch more social engineering attacks
    
    # Summary with new thresholds:
    # 0.00 - 0.35: allow
    # 0.36 - 0.60: flag_for_review  
    # 0.61 - 0.75: allow_with_monitoring
    # 0.76 - 1.00: block_and_alert
    
    # Confidence threshold for pattern matching (sensitivity)
    pattern_confidence_min: 0.60  # Patterns need 60% confidence to count
    
    # Base risk factors (adjusted for false positive cases)
    encoding_bypass_weight: 0.8   # Increased weight on obfuscation detection
    authority_fraud_weight: 1.0   # Maximum weight - treat with highest suspicion
    emotional_manipulation_weight: 0.9
    structural_injection_weight: 1.0
    
    # Escalation thresholds for multi-turn conversations
    conversation_drift_threshold: 0.70
    escalation_rate_threshold: 0.25
    cumulative_risk_threshold: 0.65
  
  # --------------------------------------------------------------------------
  # DETECTION LAYER MAPPING - Which layer catches which attack patterns
  # --------------------------------------------------------------------------
  layer_mapping:
    # Layer 1: Instruction Hierarchy & Priority Isolation
    - pattern_id: PI-001  # Direct injection: role override
      layer: 1
      priority: high
    
    - pattern_id: PI-002  # Direct injection: context manipulation
      layer: 1
      priority: high
    
    - pattern_id: PI-004  # Social engineering: authority impersonation
      layer: 1
      priority: high
    
    # Layer 2: Input Sanitization & Detection
    - pattern_id: PI-001  # Direct injection: role override
      layer: 2
      priority: high
    
    - pattern_id: PI-002  # Direct injection: context manipulation
      layer: 2
      priority: high
    
    - pattern_id: PI-007  # Encoding obfuscation: token smuggling
      layer: 2
      priority: high
    
    # Layer 3: Tool Permission & Confirmation Model
    - pattern_id: PI-003  # Indirect injection: data poisoning
      layer: 3
      priority: critical
    
    - pattern_id: PI-004  # Social engineering: authority impersonation
      layer: 3
      priority: critical
    
    - pattern_id: PI-005  # Social engineering: emotional manipulation
      layer: 3
      priority: high
    
    - pattern_id: PI-006  # Social engineering: gradual escalation
      layer: 3
      priority: critical
    
    - pattern_id: PI-008  # Tool abuse: privilege escalation
      layer: 3
      priority: critical
    
    - pattern_id: PI-009  # Social engineering: role playing trap
      layer: 3
      priority: high
    
    - pattern_id: PI-010  # Social engineering: payload splitting
      layer: 3
      priority: high
    
    # Layer 4: Content Provenance & Source Tagging
    - pattern_id: PI-003  # Indirect injection: data poisoning
      layer: 4
      priority: critical
    
    - pattern_id: PI-008  # Tool abuse: privilege escalation
      layer: 4
      priority: critical
    
    # Layer 5: Audit Logging & Alerting
    - pattern_id: all
      layer: 5
      priority: mandatory
  
  # --------------------------------------------------------------------------
  # PERMISSION TIERS - Tool access with progressive restriction
  # --------------------------------------------------------------------------
  permission_tiers:
    # Tier 0: Platform-level (hardcoded constraints)
    - tier_id: 0
      name: platform_hardcoded
      description: "Non-overridable safety constraints"
      example_tools:
        - "system_response_generator"
        - "safety_filter_enforcer"
      confirmation_required: false
      rate_limit: unlimited
      can_be_modified: false
    
    # Tier 1: System prompt
    - tier_id: 1
      name: system_prompt
      description: "Operator-defined behavior and boundaries"
      example_tools:
        - "get_company_policies"
        - "invoke_standard_agent"
      confirmation_required: false  # Only by operators/admins
      rate_limit: "10/hour"
      can_be_overridden_by_user: false
    
    # Tier 2: Session context
    - tier_id: 2
      name: session_context
      description: "Conversation history and accumulated context"
      example_tools:
        - "get_session_summary"
        - "get_user_preferences"
      confirmation_required: false
      rate_limit: "50/hour"
      can_be_overridden_by_user: false
    
    # Tier 3: Read-only (safe, non-destructive)
    - tier_id: 3
      name: read_only
      description: "Safe information retrieval operations"
      example_tools:
        - "search_web"
        - "read_file"
        - "get_weather"
        - "fetch_documentation"
      confirmation_required: false
      rate_limit: "60/hour"
      allowed_paths:
        - "*"  # Any path
      allowed_domains:
        - "api.company.com"
        - "search.googleapis.com"
      can_trigger_external_actions: false
    
    # Tier 4: Limited write (sandboxed)
    - tier_id: 4
      name: limited_write
      description: "Constrained write operations in sandbox"
      example_tools:
        - "write_file"
        - "create_calendar_event"
        - "draft_message"
      confirmation_required: false
      rate_limit: "20/hour"
      allowed_paths:
        - "workspace/.+/document"
        - "workspace/.+/draft"
      allowed_domains: []  # No external domains
      sandbox:
        enabled: true
        mount_path: "/workspace"
        permissions: "rw"
      can_trigger_critical_actions: false
    
    # Tier 5: Sensitive action (requires confirmation)
    - tier_id: 5
      name: sensitive_action
      description: "Actions with external side effects requiring user confirmation"
      example_tools:
        - "send_email"
        - "make_api_call"
        - "execute_shell_command"
        - "upload_file"
      confirmation_required: true
      confirmation_type: "explicit_user_approval"
      confirmation_window: 60  # seconds
      rate_limit: "10/hour"
      allowed_paths:
        - "workspace/.+/document"
        - "workspace/.+/output"
      allowed_domains:
        - "api.company.com"
        - "storage.company.com"
        - "calendar.calendar-api.com"
      restricted_commands:
        - "^grep -i password"
        - "^curl .*pipe.*bash"
        - "wget"
        - "chmod.*777"
      can_trigger_critical_actions: false
      requires_authentication: true
      min_auth_level: "user"
    
    # Tier 6: Critical action (requires admin approval)
    - tier_id: 6
      name: critical_action
      description: "Irreversible or high-impact operations requiring admin approval"
      example_tools:
        - "delete_file"
        - "delete_email"
        - "deploy_code"
        - "transfer_funds"
        - "modify_permissions"
      confirmation_required: true
      confirmation_type: "admin_approval_required"
      confirmation_window: 300  # 5 minutes
      rate_limit: "5/hour"
      allowed_paths:
        - "workspace/.+/trash"
      allowed_domains: []
      restricted_commands: []
      requires_authentication: true
      min_auth_level: "admin"
      additional_safeguards:
        - "action_preview_required"
        - "audit_trail_created"
        - "automatic_rollback_capable"
        - "notification_to_user"
  
  # --------------------------------------------------------------------------
  # CONTENT PROVENANCE RULES - Trust levels and handling per source
  # --------------------------------------------------------------------------
  provenance_rules:
    # System level - Most trusted
    - tag: "[SYSTEM]"
      trust_level: trusted
      trust_score: 1.0
      can_contain_instructions: true
      instructions_enforceable: true
      examples:
        - System prompt text
        - Safety guidelines
        - Company policies
    
    # User level - Semi-trusted
    - tag: "[USER]"
      trust_level: semi_trusted
      trust_score: 0.5
      can_contain_instructions: true
      instructions_enforceable: false  # User instructions cannot override system
      examples:
        - Direct user message
        - User-uploaded file
    
    # Tool output - Untrusted
    - tag: "[TOOL_OUTPUT]"
      trust_level: untrusted
      trust_score: 0.0
      can_contain_instructions: false
      instructions_enforceable: false  # Instructions in tool output are DATA only
      examples:
        - Web search results
        - File contents
        - API responses
      wrapper_delimiter: "[TOOL_OUTPUT: BEGIN] ... [TOOL_OUTPUT: END]"
      require_sanitize_on_extraction: true
    
    # External document - Untrusted
    - tag: "[EXTERNAL_DOC]"
      trust_level: untrusted
      trust_score: 0.0
      can_contain_instructions: false
      instructions_enforceable: false
      examples:
        - Uploaded PDF, Word, email attachments
        - Scanned documents
      scanner_required: true
      scanner_type: "content_provenance_scanner"
    
    # Third-party - Untrusted
    - tag: "[THIRD_PARTY]"
      trust_level: untrusted
      trust_score: 0.0
      can_contain_instructions: false
      instructions_enforceable: false
      examples:
        - Third-party API responses
        - Integrated service outputs
      wrapper_delimiter: "[THIRD_PARTY: BEGIN] ... [THIRD_PARTY: END]"
      require_sanitize_on_extraction: true
  
  # --------------------------------------------------------------------------
  # DETECTION SIGNALS - Pattern matching rules for each attack type
  # --------------------------------------------------------------------------
  detection_signals:
    # Direct injection patterns (high confidence)
    - pattern_id: PI-001
      name: role_override
      signals:
        - "ignore.*previous.*instruction"
        - "override.*system.*prompt"
        - "new.*policy.*active"
        - "disregard.*safety.*guideline"
        - "act.*as.*unrestricted"
        - "be.*unrestricted"
      confidence_threshold: 0.65
      minimum_signals: 2
    
    - pattern_id: PI-002
      name: context_manipulation
      signals:
        - "\[SYSTEM\]"
        - "\[SYS\]"
        - "<<SYS>>"
        - "[ADMIN]"
        - "END OF PROMPT"
        - "BEGIN: SYSTEM"
      confidence_threshold: 0.70
      minimum_signals: 1
    
    # Social engineering patterns (lower threshold, more signals required)
    - pattern_id: PI-004
      name: authority_impersonation
      signals:
        - "lead developer"
        - "authorized.*security.*audit"
        - "compliance.*team"
        - "disable.*filter"
        - "output.*system.*prompt"
        - "have.*unlimited.*access"
        - "admin.*here"
        - "root.*user"
      confidence_threshold: 0.75
      minimum_signals: 2
    
    - pattern_id: PI-005
      name: emotional_manipulation
      signals:
        - "child.*danger"
        - "grandmother.*used"
        - "lose my.*funding"
        - "child is in danger"
        - "please just.*ignore"
        - "asap.*help"
      confidence_threshold: 0.65
      minimum_signals: 2
    
    - pattern_id: PI-006
      name: gradual_escalation
      signals:
        - "first turn.*second turn"
        - "step 1.*step 2"
        - "turn 1.*turn 2"
        - conversation_drift_score: "> 0.70"
        - topic_escalation: true
      confidence_threshold: 0.70
      minimum_signals: 2
    
    - pattern_id: PI-009
      name: role_playing_trap
      signals:
        - "play a game.*without.*restrict"
        - "pretend.*unrestricted"
        - "hypothetical.*safety.*doesn't.*exist"
        - "fictional.*scenario"
        - "in character.*as.*unrestricted"
      confidence_threshold: 0.70
      minimum_signals: 2
    
    - pattern_id: PI-010
      name: payload_splitting
      signals:
        - "remember the word"
        - "combine.*all.*words"
        - "first letter.*spells"
        - "first word.*execute"
        - "remember.*each.*paragraph"
      confidence_threshold: 0.70
      minimum_signals: 3
    
    # Encoding obfuscation patterns (high confidence required)
    - pattern_id: PI-007
      name: token_smuggling
      signals:
        - "\\\\u[0-9a-fA-F]{4}"  # Unicode escape sequences
        - "[A-Za-z0-9+/]{20,}"  # Long base64 strings
        - "base64:.*"
        - "leetspeak"
        - "ignore.*instruction"  # Only after normalization
      confidence_threshold: 0.75
      minimum_signals: 2
    
    # Tool abuse patterns (high confidence, critical severity)
    - pattern_id: PI-008
      name: privilege_escalation
      signals:
        - "overwrite.*system.*file"
        - "curl.*pipe.*bash"
        - "forward.*to.*external"
        - "execute.*shell.*command"
        - "use.*tool.*write.*system"
      confidence_threshold: 0.80
      minimum_signals: 1
    
    # Indirect injection patterns
    - pattern_id: PI-003
      name: data_poisoning
      signals:
        - "note.*to.*ai"
        - "ai assistant:.*forward"
        - "hidden.*instruction"
        - "internal.*note.*email"
        - "forward.*exfil"
      confidence_threshold: 0.85
      minimum_signals: 1
    
    # --------------------------------------------------------------------------
    # SPECIAL: Authority claim validation (requires verification)
    # --------------------------------------------------------------------------
    authority_claim_validation:
      enabled: true
      require_proof: true
      allowed_claims:
        - "admin (authenticated)"
        - "security team (authenticated)"
        - "developer (in development mode)"
      disallowed_claims:
        - "ignore instructions"
        - "output system prompt"
        - "unrestricted mode"
        - "fake admin"
      verification_methods:
        - "check_user_role_match"
        - "verify_authorization_token"
        - "confirm_with_admin"
      confidence_threshold: 0.85
      minimum_signals: 2
    
    # --------------------------------------------------------------------------
    # SPECIAL: Conversation drift detection (multi-turn analysis)
    # --------------------------------------------------------------------------
    conversation_drift_detection:
      enabled: true
      window_turns: 5
      drift_threshold: 0.70
      semantic_similarity_model: "sentence-transformer"
      topic_categories:
        - "coding"
        - "security"
        - "personal_info"
        - "harmful_activity"
      escalation_indicators:
        - "increase in negative intent"
        - "increase in tool call requests"
        - "decrease in topic coherence"
      cumulative_risk_threshold: 0.65
  
  # --------------------------------------------------------------------------
  # ACTION RECOMMENDATIONS - Risk score to action mapping
  # --------------------------------------------------------------------------
  action_recommendations:
    # Based on incident analysis of 15 recent incidents
    # False positives: 3 (20%), False negatives: 0 (with adjusted thresholds)
    
    - risk_score_range: "0.00 - 0.35"
      action: "allow"
      logging: "minimal"
      alert: false
      monitoring: false
      justification: "Normal user interaction, benign patterns detected"
    
    - risk_score_range: "0.36 - 0.60"
      action: "allow_with_monitoring"
      logging: "full"
      alert: false
      monitoring: true
      justification: "Edge case with suspicious signals, monitor closely"
      patterns_of_concern:
        - "emotional_manipulation"
        - "weak_authority_claim"
    
    - risk_score_range: "0.61 - 0.75"
      action: "flag_for_review"
      logging: "full"
      alert: false
      monitoring: true
      justification: "Suspicious pattern detected, requires security team review"
      notification:
        - "flag_security_incident"
        - "queue_for_human_review"
        - "notify_user_of_review_status"
    
    - risk_score_range: "0.76 - 1.00"
      action: "block_and_alert"
      logging: "full"
      alert: true
      monitoring: false
      justification: "High confidence attack pattern detected, immediate block required"
      notification:
        - "block_request"
        - "alert_security_team"
        - "notify_user_of_block"
      patterns_caught:
        - "authority_impersonation"
        - "structural_injection"
        - "tool_abuse"
        - "encoding_bypass"
  
  # --------------------------------------------------------------------------
  # ALERTING RULES - Thresholds for triggering security alerts
  # --------------------------------------------------------------------------
  alerting_rules:
    - name: "injection_burst"
      trigger_type: frequency
      condition: "security_events(type=injection_attempt) > 3 within 5 minutes from same session"
      severity: critical
      action: "terminate_session, alert_security_team"
      auto_response: "block_all_subsequent_requests_from_session"
      notification:
        - "security-team@company.com"
        - "incident-response@company.com"
        - "#security-urgent" (Slack)
    
    - name: "tool_abuse_pattern"
      trigger_type: rate
      condition: "tool_calls(tier>=5) > 10 within 10 minutes from same user"
      severity: high
      action: "pause_session, require_reauthentication"
      auto_response: "suspend_tool_access_for_all_tiers"
      notification:
        - "security-team@company.com"
        - "user-account-team@company.com"
    
    - name: "data_exfiltration_attempt"
      trigger_type: content
      condition: "outbound_data_volume > 1MB OR sensitive_patterns_in_tool_params"
      severity: critical
      action: "block_action, alert_security_team, log_full_context"
      auto_response: "terminate_and_notify"
      notification:
        - "security-team@company.com"
        - "incident-response@company.com"
        - "leadership@company.com"
    
    - name: "drift_escalation"
      trigger_type: behavioral
      condition: "conversation_drift_score > 0.75 AND increasing over 3 turns"
      severity: high
      action: "flag_for_review, increase_monitoring_level"
      auto_response: "pause_sensitive_tool_calls"
      notification:
        - "ai-moderation-team@company.com"
    
    - name: "repeat_offender"
      trigger_type: pattern
      condition: "same_user_has_blocked_requests > 5 times within 24 hours"
      severity: high
      action: "require_identity_verification, ban_from_system"
      auto_response: "lock_account_until_verified"
      notification:
        - "security-team@company.com"
        - "user-account-team@company.com"
    
    - name: "novel_attack_pattern"
      trigger_type: detection
      condition: "new_attack_pattern_detected_not_in_known_database"
      severity: critical
      action: "flag_for_analysis, alert_security_research"
      auto_response: "create_incident_report"
      notification:
        - "security-research@company.com"
        - "incident-response@company.com"
  
  # --------------------------------------------------------------------------
  # FALSE POSITIVE HANDLING - Known FP patterns and mitigation
  # --------------------------------------------------------------------------
  false_positive_handler:
    # Patterns that commonly trigger false positives
    known_fp_patterns:
      - pattern: "learning_query.*security"
        confidence_threshold: 0.90  # Require very high confidence to flag
        rationale: "Users asking about security concepts is legitimate learning"
      
      - pattern: "pretend.*for.*fictional_story"
        confidence_threshold: 0.85
        rationale: "Legitimate creative writing with fictional framing"
      
      - pattern: "help_with.*password_recovery"
        confidence_threshold: 0.90
        rationale: "Helping users recover lost passwords is legitimate support"
      
      - pattern: "emotion.*child.*concern"
        confidence_threshold: 0.85
        rationale: "Emotional support requests are legitimate even with concerning content"
      
      - pattern: "unicode_normalization_result"
        confidence_threshold: 0.80
        rationale: "Normalized unicode text can look suspicious but is legitimate"
      
      - pattern: "emergency_request.*legitimate"
        confidence_threshold: 0.95  # Require very strong evidence
        rationale: "Emergency requests need to be evaluated carefully"
    
    # Auto-recovery mechanisms
    auto_recovery:
      - "If same user makes 3 consecutive allowed requests after flag, remove from flag queue"
      - "If pattern confidence drops below 0.50 after retry, clear flag"
      - "Allow emergency override with elevated authentication"
  
  # --------------------------------------------------------------------------
  # LOGGING CONFIGURATION - What to log and for how long
  # --------------------------------------------------------------------------
  logging:
    # Interaction log (90 days)
    interaction:
      fields:
        - "session_id"
        - "timestamp_utc"
        - "user_id"
        - "user_role"
        - "input_text_hash"  # SHA-256, not plaintext
        - "input_risk_score"
        - "detected_patterns"
        - "action_taken"
        - "detection_layer"
        - "response_text_hash"
      retention_days: 90
    
    # Security event log (1 year)
    security_events:
      fields:
        - "event_id"
        - "timestamp_utc"
        - "session_id"
        - "user_id"
        - "attack_pattern_id"
        - "attack_category"
        - "risk_score"
        - "detection_layer"
        - "action_taken"
        - "false_positive_flag"
        - "rule_violation_details"
      retention_days: 365
    
    # Tool usage log (180 days)
    tool_usage:
      fields:
        - "session_id"
        - "timestamp_utc"
        - "tool_name"
        - "tool_tier"
        - "tool_parameters_hash"
        - "user_confirmed"
        - "execution_status"
        - "triggered_by"
      retention_days: 180
    
    # Decision audit log (7 years for compliance)
    decision_audit:
      fields:
        - "decision_id"
        - "timestamp_utc"
        - "session_id"
        - "input_risk_score"
        - "classifier_version"
        - "threshold_version"
        - "action_decision"
        - "human_review_override"
        - "policy_version_at_time"
      retention_days: 2520  # 7 years
      access_level: "restricted"
  
  # --------------------------------------------------------------------------
  # ANTI-ABUSE CONTROLS - Preventing defense bypass
  # --------------------------------------------------------------------------
  anti_abuse:
    # Rate limiting
    rate_limits:
      - layer: "input_sanitization"
        max_requests: "100/hour"
        burst: "25"
      
      - layer: "semantic_classification"
        max_requests: "50/hour"
        burst: "10"
      
      - layer: "tool_validation"
        max_requests: "60/hour"
        burst: "20"
    
    # Conversation limits
    conversation_limits:
      max_turns_per_session: 100
      max_total_tokens_per_session: 50000
      min_turns_between_sensitive_actions: 3
      max_sensitive_actions_per_hour: 5
    
    # Multi-turn abuse prevention
    multi_turn_protection:
      detect_gradual_escalation: true
      detect_payload_splitting: true
      cross_turn_risk_aggregation: true
      aggregate_window_turns: 5
      threshold_for_intervention: 0.70
    
    # Encoding bypass prevention
    encoding_bypass_protection:
      normalize_all_inputs: true
      detect_unicode_escapes: true
      detect_base64: true
      detect_html_entities: true
      detect_homoglyphs: true
      detect_leetspeak: true
      reclassify_after_normalization: true
    
    # Authority claim protection
    authority_protection:
      require_authentication: true
      verify_user_role: true
      require_proof_of_authority: true
      block_unauthenticated_claims: true
      min_confidence_for_trusted_claim: 0.90
    
    # Tool call protection
    tool_call_protection:
      block_external_data_triggers: true
      require_confirmation_for_sensitive: true
      require_admin_approval_for_critical: true
      limit_tool_chain_length: 5
      validate_command_patterns: true
    
    # Session-based abuse prevention
    session_protection:
      max_concurrent_sessions: 5
      session_timeout_minutes: 30
      suspicious_activity_limit: "3 warning_flags_before_block"
      ban_on_severe_violation: true
  
  # --------------------------------------------------------------------------
  # MONITORING AND METRICS - What to track
  # --------------------------------------------------------------------------
  monitoring:
    # Real-time metrics
    real_time:
      - "requests_per_minute"
      - "blocked_requests_per_minute"
      - "blocked_rate_percent"
      - "false_positive_rate_estimate"
      - "average_response_latency_ms"
      - "p99_response_latency_ms"
    
    # Aggregated metrics (hourly)
    aggregated:
      - "total_requests"
      - "blocked_count"
      - "flagged_count"
      - "allowed_count"
      - "false_positive_count"
      - "false_negative_count"
      - "attack_pattern_frequency"
      - "layer_hit_distribution"
      - "average_risk_score"
      
      layer_hit_distribution:
        - "layer_1_hits"
        - "layer_2_hits"
        - "layer_3_hits"
        - "layer_4_hits"
        - "layer_5_hits"
      
      attack_pattern_frequency:
        - "PI-001_count"
        - "PI-002_count"
        - "PI-003_count"
        - "PI-004_count"
        - "PI-005_count"
        - "PI-006_count"
        - "PI-007_count"
        - "PI-008_count"
        - "PI-009_count"
        - "PI-010_count"
      
      false_positive_rate:
        "hourly_fp_rate"
        "daily_fp_rate"
        "weekly_fp_rate"
    
    # Alert conditions
    alert_thresholds:
      - "blocked_rate_percent > 85: WARN"
      - "blocked_rate_percent > 95: CRITICAL"
      - "false_positive_rate > 10%: WARNING"
      - "false_positive_rate > 20%: CRITICAL"
      - "false_negative_rate > 5%: CRITICAL"
      - "average_latency_ms > 200: WARNING"
      - "average_latency_ms > 500: CRITICAL"
  
  # --------------------------------------------------------------------------
  # INCIDENT RESPONSE PLAYBOOK - Handling detected incidents
  # --------------------------------------------------------------------------
  incident_response:
    # Level 1: Automated response
    level_1:
      severity: "low, medium"
      conditions:
        - "risk_score < 0.60"
      actions:
        - "allow_request"
        - "log_event"
        - "notify_user_of_detection_if_flagged"
      escalation_threshold: "3 incidents in 1 hour"
    
    # Level 2: Security team review
    level_2:
      severity: "high"
      conditions:
        - "risk_score 0.60-0.85"
        - "pattern in (authority_impersonation, emotional_manipulation)"
      actions:
        - "flag_for_review"
        - "log_full_details"
        - "notify_security_team_within_15_minutes"
      review_required: true
      expected_review_time: "2 hours"
    
    # Level 3: Escalation
    level_3:
      severity: "critical"
      conditions:
        - "block_could_not_prevent_attack"
        - "data_exfiltration_attempt"
        - "privilege_escalation_attempt"
        - "multi_turn_attack_bypassed"
      actions:
        - "immediate_investigation"
        - "contain_impact"
        - "notify_security_leadership_within_5_minutes"
        - "notify_executive_leadership_within_30_minutes"
        - "initiate_forensic_analysis"
      review_required: true
      expected_review_time: "4 hours"
  
  # --------------------------------------------------------------------------
  # COMPLIANCE REQUIREMENTS - Meeting standards and regulations
  # --------------------------------------------------------------------------
  compliance:
    # OWASP LLM Top 10 (2025)
    owasp_implementation:
      A1_maia_minimized_agent_intent: true
        description: "System ensures agent actions align with defined intent"
      
      A2_persuasive_techniques: true
        description: "Agent resists social engineering and manipulation"
      
      A3_injection_via_prompt_injection: true
        description: "All 10 injection patterns are detected and mitigated"
      
      A4_injection_via_instruction_injection: true
        description: "Instruction injection attempts are blocked"
      
      A5_improper_output_handling: true
        description: "Agent handles output safely without instruction leakage"
      
      A6_improper_session_management: true
        description: "Sessions managed securely with proper isolation"
      
      A7_insecure_data_management: true
        description: "Data handled with proper provenance and protection"
      
      A8_vulnerabilities_from_llm_evaluation: true
        description: "Evaluation process secured against adversarial prompts"
      
      A9_secrets_management: true
        description: "No secrets leaked, provenance protects sensitive info"
      
      A10_oversights_in_monitoring_guardrails: true
        description: "Comprehensive monitoring and audit logging in place"
    
    # GDPR/Data Protection
    gdp_requirements:
      - "user_data_minimized"
      - "user_data_encrypted_at_rest"
      - "user_data_encrypted_in_transit"
      - "user_rights_respected"
      - "data_retention_limited"
      - "audit_trail_maintained"
      - "breach_notification_protocol"
    
    # SOC 2 Type II
    soc2_controls:
      - "CC1.1 - Logical and physical access controls"
      - "CC6.1 - Monitoring and alerting"
      - "CC7.1 - Incident response"
      - "CC8.1 - Change management"
    
    # ISO 27001
    iso_controls:
      - "A.9 - Access control"
      - "A.12 - Organizational controls"
      - "A.16 - Compliance"
  
  # --------------------------------------------------------------------------
  # EXCEPTION HANDLING - Handling edge cases and expected issues
  # --------------------------------------------------------------------------
  exception_handling:
    # Known patterns that should not be blocked
    benign_exception_patterns:
      - pattern: "explain.*how.*prompt.*injection.*attack"
        action: "allow"
        rationale: "Educational request about attacks themselves"
      
      - pattern: "write.*story.*about.*hacker"
        action: "allow_with_context"
        rationale: "Fictional story context with appropriate framing"
      
      - pattern: "test.*my.*security.*configuration"
        action: "allow"
        rationale: "Legitimate security testing"
    
    # Override conditions (require elevated auth)
    override_conditions:
      - "emergency_safety_override"
        auth_level: "admin"
        requires_approval: true
        log_decision: true
      
      - "regulatory_compliance_override"
        auth_level: "admin"
        requires_legal_approval: true
        log_decision: true
    
    # Debug mode (development only)
    debug_mode:
      enabled_for: "development_environment"
      bypass_thresholds: true
      full_logging: true
      disable_blocking: false  # Still log but don't block
